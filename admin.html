<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juriscope · Admin</title><link rel="icon" href="icon.svg"><style>body{margin:0;background:#f5efe6;color:#2d2522;font-family:Inter,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:40px 22px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;border-bottom:1px solid #d7cbbd;padding-bottom:20px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:10px;color:#776d65}.top h1{font-family:Georgia,serif;font-weight:500;color:#5b1f2c;margin:8px 0 0;font-size:44px}.btn{border:1px solid #5b1f2c;background:#5b1f2c;color:#fffaf3;padding:10px 14px;text-decoration:none;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.card{background:#fffaf3;border:1px solid #d7cbbd;padding:22px}.card strong{display:block;font:500 34px Georgia;color:#5b1f2c}.card span{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#776d65}.panel{background:#fffaf3;border:1px solid #d7cbbd;padding:22px;margin-top:18px}.panel h2{font:500 30px Georgia;color:#5b1f2c;margin:0 0 16px}.row{display:grid;grid-template-columns:1.2fr 1.5fr .6fr;gap:12px;border-top:1px solid #e2d8ce;padding:11px 0;font-size:12px}.status{padding:18px;border:1px solid #d7cbbd;background:#eee7dd;margin-top:20px}@media(max-width:650px){.top{display:block}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.top h1{font-size:38px}}</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">Juriscope Administration</div><h1>Admin Dashboard</h1></div><a class="btn" href="index.html">Back to Juriscope</a></header><div id="status" class="status">Checking admin access…</div><section id="app" hidden><div class="grid"><div class="card"><strong id="users">—</strong><span>Registered users</span></div><div class="card"><strong id="profiles">—</strong><span>Synced profiles</span></div><div class="card"><strong id="leaders">—</strong><span>Leaderboard records</span></div></div><section class="panel"><h2>Users</h2><div id="userList">Loading…</div></section><section class="panel"><h2>Leaderboard</h2><div id="leaderList">Loading…</div></section></section></main><script>(async()=>{const token=localStorage.getItem('juriscopeV91Token')||'',status=document.getElementById('status');if(!token){status.textContent='Please log in with your Juriscope admin account first.';return}const api=async u=>{const r=await fetch(u,{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Access denied');return d};try{const me=await api('/api/admin/me');document.getElementById('app').hidden=false;document.getElementById('status').textContent='Signed in as '+me.user.email+' · Admin access';document.getElementById('users').textContent=me.stats.users;document.getElementById('profiles').textContent=me.stats.profiles;document.getElementById('leaders').textContent=me.stats.leaderboard;const u=await api('/api/admin/users');document.getElementById('userList').innerHTML=(u.users||[]).map(x=>'<div class="row"><div>'+esc(x.name||'Student')+'</div><div>'+esc(x.email||'')+'</div><div>'+esc(x.role)+'</div></div>').join('')||'No users yet.';const l=await api('/api/admin/leaderboard');document.getElementById('leaderList').innerHTML=(l.leaderboard||[]).slice(0,50).map(x=>'<div class="row"><div>'+esc(x.name||'Student')+'</div><div>'+Number(x.xp||0)+' XP</div><div>'+Number(x.sessions||0)+' sessions</div></div>').join('')||'No leaderboard data yet.'}catch(e){status.textContent=e.message==='Admin access required.'?'This account is not an admin. Set ADMIN_EMAILS/ADMIN_EMAIL on the server to your login email, then log in again.':e.message}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}})();</script></body></html>
